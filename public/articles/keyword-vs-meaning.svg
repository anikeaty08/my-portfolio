ont, Xiaolai, Segoe UI Emoji" font-size="19px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">Shared words: only &quot;result&quot;</text><text x="280" y="512.2" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="19px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">Score 1. Not enough, so</text><text x="280" y="538.8" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="19px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">no evidence is sent.</text><rect x="580" y="130" width="480" height="440" rx="16" fill="#ffffff" stroke="none"/><path d="M596.0 131.3 Q820.0 130.3 1044.0 129.1 A16 16 0 0 1 1059.7 146.0 Q1059.2 350.0 1059.5 554.0 A16 16 0 0 1 1044.0 569.5 Q820.0 569.1 596.0 568.8 A16 16 0 0 1 579.2 554.0 Q581.1 350.0 579.7 146.0 A16 16 0 0 1 596.0 130.7 Z M596.0 129.3 Q820.0 129.9 1044.0 131.0 A16 16 0 0 1 1060.0 146.0 Q1059.7 350.0 1060.4 554.0 A16 16 0 0 1 1044.0 570.6 Q820.0 571.5 596.0 571.3 A16 16 0 0 1 578.8 554.0 Q579.7 350.0 579.9 146.0 A16 16 0 0 1 596.0 130.6 Z" fill="none" stroke="#1e1e1e" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M598.0 138.1 Q820.0 134.9 1042.0 137.2 A11 11 0 0 1 1053.4 148.0 Q1051.3 350.0 1053.3 552.0 A11 11 0 0 1 1042.0 563.5 Q820.0 563.8 598.0 562.1 A11 11 0 0 1 587.7 552.0 Q589.0 350.0 587.0 148.0 A11 11 0 0 1 598.0 137.7 Z M598.0 137.7 Q820.0 135.8 1042.0 136.2 A11 11 0 0 1 1051.9 148.0 Q1054.5 350.0 1052.1 552.0 A11 11 0 0 1 1042.0 562.8 Q820.0 564.2 598.0 564.3 A11 11 0 0 1 586.7 552.0 Q584.9 350.0 587.1 148.0 A11 11 0 0 1 598.0 135.8 Z" fill="none" stroke="#1e1e1e" stroke-width="1.6"/><text x="820" y="186.0" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="22px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">Meaning search: compare embeddings</text><rect x="620" y="205" width="400" height="100" rx="16" fill="#ffffff" stroke="none"/><path d="M636.0 205.9 Q820.0 205.2 1004.0 204.0 A16 16 0 0 1 1020.1 221.0 Q