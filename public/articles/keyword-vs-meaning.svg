xt><text x="820.0" y="401.5" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="18px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">&quot;21 days&quot;</text><text x="820" y="485.6" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="19px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">Nearest page:</text><text x="820" y="512.2" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="19px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">exams/revaluation.md</text><text x="820" y="538.8" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="19px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">Found, in different words.</text><text x="550" y="639.2" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="21px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;">The best systems run both and merge the two lists. That is called hybrid search.</text><text x="550" y="669.9" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="17px" fill="#6b6b6b" text-anchor="middle" style="white-space: pre;">Keyword search wins on exact codes like ERR_404. Meaning search wins on rephrased questions.</text></svg>